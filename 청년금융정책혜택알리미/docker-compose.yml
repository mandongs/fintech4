version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: youth_finance_db
    environment:
      POSTGRES_DB: youth_finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: youth_finance_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/youth_finance
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-32chars}
      FSS_API_KEY: ${FSS_API_KEY:-}
      YOUTH_POLICY_API_KEY: ${YOUTH_POLICY_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FAISS_INDEX_PATH: /app/data/policy_vector_index.faiss
      POLICY_EMBED_PATH: /app/data/policy_embeddings.csv
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: youth_finance_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_BASE_URL: http://localhost:8000

volumes:
  postgres_data:
